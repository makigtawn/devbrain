name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR makes the in-flight run obsolete; don't burn runners finishing it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    env:
      # Syntactically valid placeholders, not secrets. `next build` only prerenders static
      # routes (/, /_not-found, /opengraph-image) — nothing here opens a database connection
      # or calls Supabase. Using real-shaped values rather than SKIP_ENV_VALIDATION means CI
      # also proves src/env.ts accepts a well-formed config.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/devbrain
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Also runs the postinstall `prisma generate`, which the build needs — the generated
      # client is gitignored, so a fresh checkout has no @/generated/prisma without it.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  extension:
    name: extension — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension

    env:
      PLASMO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      PLASMO_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      PLASMO_PUBLIC_API_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
